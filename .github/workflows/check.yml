name: Distribution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  distribution:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/build_release.py
      - run: python -B .build/sdd-init/scripts/test_govern.py
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir .build/dist
      - run: python -B scripts/smoke_package.py --from .build/dist/sdd_init-0.5.5-py3-none-any.whl
