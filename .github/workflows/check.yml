name: Distribution checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Optional commit or PR merge ref to test using the main workflow
        type: string
      candidate_sha:
        description: Expected exact candidate SHA (required by delivery)
        type: string
  workflow_call:
    inputs:
      candidate_ref:
        type: string
        required: true
      candidate_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: true
jobs:
  distribution:
    name: distribution-${{ matrix.os }}-py${{ matrix.python }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          persist-credentials: false
      - name: Verify candidate commit
        if: inputs.candidate_sha != ''
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/build_release.py
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir .build/dist
      - name: Smoke-test built wheel
        run: >-
          python -c "from pathlib import Path; import subprocess, sys;
          wheels = list(Path('.build/dist').glob('*.whl'));
          len(wheels) == 1 or sys.exit(f'Expected exactly one wheel in .build/dist, found {len(wheels)}: {wheels}');
          subprocess.run([sys.executable, '-B', 'scripts/smoke_package.py', '--from', str(wheels[0])], check=True)"
      - name: Record tested package provenance
        if: inputs.candidate_sha != '' && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        env:
          TESTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib, json, os, subprocess, tomllib
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if sha != os.environ['TESTED_SHA']:
              raise SystemExit('Source SHA changed during checks')
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          folder = Path('.build/dist')
          uv_ignore = folder / '.gitignore'
          if uv_ignore.exists():
              if not uv_ignore.is_file() or uv_ignore.read_bytes().strip() != b'*':
                  raise SystemExit('Unexpected uv output-directory marker')
              uv_ignore.unlink()
          packages = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in folder.iterdir() if p.is_file()}
          expected = {f'sdd_init-{version}-py3-none-any.whl', f'sdd_init-{version}.tar.gz'}
          if set(packages) != expected:
              raise SystemExit('Unexpected release package set')
          (folder / 'PROVENANCE.json').write_text(json.dumps({'sha': sha, 'version': version, 'files': packages}), encoding='utf-8')
          PY
      - name: Preserve tested release packages
        if: inputs.candidate_sha != '' && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: .build/dist/*
          if-no-files-found: error
          retention-days: 1
