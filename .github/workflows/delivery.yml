name: Native reviewed delivery

on:
  pull_request_target:
    branches: [main]
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Existing same-repository PR number targeting main
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: native-reviewed-delivery
  queue: max
  cancel-in-progress: false

jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Review, bounded native repair, verified merge and release
        env:
          SDD_DELIVERY_TOKEN: ${{ secrets.SDD_DELIVERY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          CONTROLLER_SHA: ${{ github.sha }}
        run: python -B scripts/github_delivery.py
      - name: Preserve delivery receipt, including blocked or partial outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-receipt-${{ github.run_id }}
          path: .build/delivery/receipt.json
          if-no-files-found: warn
          retention-days: 30
