[package]
name = "sdd-rust-example"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
opentelemetry = { version = "=0.27.1", features = ["logs"] }
opentelemetry_sdk = { version = "=0.27.1", features = ["logs", "rt-tokio"] }
opentelemetry-otlp = { version = "=0.27.0", default-features = false, features = ["logs", "http-proto", "reqwest-client"] }
serde_json = "=1.0.138"
tokio = { version = "=1.43.0", features = ["rt-multi-thread", "macros"] }
uuid = { version = "=1.12.1", features = ["v4"] }
