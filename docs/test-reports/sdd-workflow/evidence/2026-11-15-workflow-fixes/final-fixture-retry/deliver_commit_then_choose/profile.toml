model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
default_permissions = "fixture-write"
approval_policy = "never"
cli_auth_credentials_store = "file"
suppress_unstable_features_warning = true
allow_login_shell = false
[features]
plugins = false
multi_agent_v2 = true
skill_search = false
skip_host_skill_discovery = true
[agents]
max_threads = 8
max_depth = 2

[permissions.fixture-write.filesystem]
":minimal" = "read"
"/tmp/sdd-review-execution-gzbeuvns/program" = "read"
"/tmp/sdd-review-execution-gzbeuvns/deliver_commit_then_choose-incsllag/workflow-bundle/shared" = "read"
"/tmp/sdd-review-execution-gzbeuvns/deliver_commit_then_choose-incsllag/scratch" = "write"
[permissions.fixture-write.filesystem.":workspace_roots"]
"." = "write"
".agents" = "read"
".codex" = "read"
".git" = "write"
[permissions.fixture-write.network]
enabled = false
