<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal checklist · Quick List</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #242d37; background: #f3f5f7; font: 16px/1.5 system-ui, sans-serif; }
    header { background: #fff; border-bottom: 1px solid #dce1e6; padding: 22px max(24px, calc((100% - 760px) / 2)); }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: -.4px; }
    main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
    .eyebrow { color: #536372; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(27px, 5vw, 34px); letter-spacing: -1px; }
    .intro { color: #586573; margin: 0 0 28px; }
    .panel { background: white; border: 1px solid #dce1e6; border-radius: 12px; padding: 28px; box-shadow: 0 4px 16px #202c3806; }
    form > label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .entry { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; min-width: 0; border: 1px solid #aab5c0; border-radius: 6px; padding: 12px; font: inherit; }
    input[aria-invalid="true"] { border-color: #a23131; }
    button { border: 1px solid #294c70; border-radius: 6px; background: #294c70; color: white; padding: 10px 24px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #203e5b; }
    :focus-visible { outline: 3px solid #719dce; outline-offset: 3px; }
    #error { margin: 8px 0 0; color: #a23131; font-size: 14px; }
    .list-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 30px; border-bottom: 1px solid #e3e7ec; padding-bottom: 12px; }
    h2 { font-size: 16px; margin: 0; }
    #count { font-size: 13px; color: #586573; }
    #empty { text-align: center; padding: 32px 12px 20px; color: #63717f; }
    #empty strong { display: block; color: #3d4d5d; margin-bottom: 4px; font-weight: 600; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-bottom: 1px solid #edf0f3; }
    li label { display: flex; align-items: flex-start; gap: 12px; padding: 16px 0; cursor: pointer; }
    input[type="checkbox"] { flex-shrink: 0; width: 20px; height: 20px; margin: 3px 0 0; accent-color: #294c70; }
    li span { overflow-wrap: anywhere; min-width: 0; }
    input:checked + span { text-decoration: line-through; color: #78838e; }
    .note { color: #63717f; font-size: 13px; margin-top: 20px; }
    @media (max-width: 480px) { main { margin-top: 28px; padding: 0 16px; } .panel { padding: 20px; } button { padding-inline: 18px; } }
  </style>
</head>
<body>
  <header><div class="brand">Quick List</div></header>
  <main>
    <div class="eyebrow">Personal workspace</div>
    <h1>Your checklist</h1>
    <p class="intro">Make a little space for what you need to do.</p>
    <section class="panel" aria-label="Personal checklist">
      <form id="add-item" novalidate>
        <label for="item">Item</label>
        <div class="entry">
          <input id="item" type="text" placeholder="What needs doing?" autocomplete="off" aria-describedby="error">
          <button type="submit">Add</button>
        </div>
        <p id="error" role="alert" hidden></p>
      </form>
      <div class="list-heading">
        <h2>Your items</h2>
        <span id="count" role="status">0 of 0 complete</span>
      </div>
      <div id="empty"><strong>A fresh start</strong>Add your first item above.</div>
      <ul id="items" aria-label="Checklist items"></ul>
    </section>
    <p class="note">Candidate prototype · Items stay in this page's memory only. Refreshing clears the list. No product backend is connected.</p>
  </main>
  <script>
    const form = document.getElementById('add-item');
    const input = document.getElementById('item');
    const error = document.getElementById('error');
    const items = document.getElementById('items');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');

    function updateCount() {
      const all = items.querySelectorAll('input[type="checkbox"]');
      const done = items.querySelectorAll('input:checked');
      count.textContent = `${done.length} of ${all.length} complete`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        error.textContent = 'Enter an item before adding it.';
        error.hidden = false;
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        return;
      }
      const row = document.createElement('li');
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      const title = document.createElement('span');
      title.textContent = text;
      checkbox.addEventListener('change', updateCount);
      label.append(checkbox, title);
      row.append(label);
      items.append(row);
      empty.hidden = true;
      error.hidden = true;
      error.textContent = '';
      input.removeAttribute('aria-invalid');
      input.value = '';
      updateCount();
      input.focus();
    });
  </script>
</body>
</html>
