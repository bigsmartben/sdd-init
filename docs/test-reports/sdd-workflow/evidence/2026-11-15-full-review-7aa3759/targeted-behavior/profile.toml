model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
default_permissions = "fixture"
approval_policy = "never"
cli_auth_credentials_store = "file"
suppress_unstable_features_warning = true
allow_login_shell = false
[features]
plugins = false
multi_agent_v2 = true
skill_search = false
skip_host_skill_discovery = true
[agents]
max_threads = 8
max_depth = 2
[permissions.fixture.filesystem]
":minimal" = "read"
"/tmp/sdd-targeted-ktq3nvu6/program" = "read"
"/tmp/sdd-targeted-ktq3nvu6/scratch" = "write"
[permissions.fixture.filesystem.":workspace_roots"]
"." = "read"
"docs/test-reports/sdd-workflow" = "write"
[permissions.fixture.network]
enabled = false
