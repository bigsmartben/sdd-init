[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-init"
version = "0.8.7"
description = "Bootstrap the sdd-init skill for Codex and GitHub Copilot repositories"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
sdd-init = "sdd_init.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
